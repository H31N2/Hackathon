[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vertrags-anonymisierer"
version = "0.1.0"
description = "Verträge anonymisieren, mit Claude bearbeiten und fehlerfrei zurückanonymisieren"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=2.12",
  "cryptography>=42",
  "fastapi>=0.110",
  "python-docx>=1.1",
  "python-multipart>=0.0.9",
  "pdfplumber>=0.11",
  "typer>=0.12",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
# EmbeddingGemma ohne Ollama (Modell google/embeddinggemma-300m von Hugging Face)
embedding = ["sentence-transformers>=5.0"]
# Zusätzliche Namenserkennung; danach: python -m spacy download de_core_news_lg
ner = ["spacy>=3.7"]
dev = ["pytest>=8", "httpx>=0.27", "reportlab>=4"]

[project.scripts]
vertrags-anonymisierer = "vertrags_anonymisierer.oberflaeche.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"vertrags_anonymisierer.oberflaeche" = ["seite.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
